<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="45%" stop-color="#2a3344"/>
      <stop offset="100%" stop-color="#12151c"/>
    </linearGradient>
    <radialGradient id="spotL" cx="22%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#c4b8a8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8a7f72" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotR" cx="78%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#9eb4c8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#5a6d7d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="50%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#3d3832" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0c0c0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2228" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
